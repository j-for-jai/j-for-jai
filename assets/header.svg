<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="Jaivardhan Singh. AI/ML Engineer">
  <style>
    .name { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #A8652A; opacity: 0;
            animation: rise 0.9s ease-out 0.2s forwards; }
    .role { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; opacity: 0; }
    .r1 { animation: cycle 9s linear 1.1s infinite; }
    .r2 { animation: cycle 9s linear 4.1s infinite; }
    .r3 { animation: cycle 9s linear 7.1s infinite; }
    .bar { fill: #A8652A; transform-origin: 0 0; transform: scaleX(0); animation: grow 1s ease-out 0.1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      5%, 30% { opacity: 1; transform: translateY(0); }
      35%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .name, .bar { animation: none; opacity: 1; transform: none; }
      .r1 { animation: none; opacity: 1; }
    }
  </style>
  <rect class="bar" x="20" y="22" width="60" height="4" rx="2"/>
  <text class="name" x="20" y="78">Jaivardhan Singh</text>
  <text class="role r1" x="20" y="118">AI/ML Engineer</text>
  <text class="role r2" x="20" y="118">LLM evaluation &amp; cost optimization</text>
  <text class="role r3" x="20" y="118">Agentic systems &amp; model training</text>
</svg>
